name: Validate TAHA daily target date

on:
  push:
    branches: [fix/taha-daily-target-date]
    paths:
      - scripts/fix_daily_target_date.py
      - .github/workflows/daily-target-date.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message || '', '[daily-date-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/taha-daily-target-date
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Apply patch
        run: python3 scripts/fix_daily_target_date.py
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build and tests
        run: pnpm test
      - name: Commit validated fix
        run: |
          rm -f scripts/fix_daily_target_date.py .github/workflows/daily-target-date.yml
          git config user.name "TAHA AI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: bind daily schedules to target publication date [daily-date-fixed]"
          git push origin HEAD:fix/taha-daily-target-date
