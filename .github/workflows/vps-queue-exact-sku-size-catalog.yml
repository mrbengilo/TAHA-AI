name: Queue exact SKU and size Facebook catalog

on:
  push:
    branches: [codex/vps-release-space]
    paths: [deploy/vps/queue-exact-sku-size-catalog.py, .github/workflows/vps-queue-exact-sku-size-catalog.yml]

permissions:
  contents: write

concurrency:
  group: taha-vps-exact-sku-size-catalog
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VPS_HOST: ${{ secrets.TAHA_VPS_HOST }}
      VPS_USER: ${{ secrets.TAHA_VPS_USER }}
      VPS_PORT: ${{ secrets.TAHA_VPS_PORT }}
      VPS_KEY: ${{ secrets.TAHA_VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify queue script
        run: python3 -m py_compile deploy/vps/queue-exact-sku-size-catalog.py
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/id_taha_vps
          chmod 600 ~/.ssh/id_taha_vps
      - name: Queue exact catalog and resume worker
        run: |
          set -o pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -i ~/.ssh/id_taha_vps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            python3 -u - < deploy/vps/queue-exact-sku-size-catalog.py 2>&1 | tee deploy/vps/exact-sku-size-catalog-output.txt
      - name: Save queue result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/vps/exact-sku-size-catalog-output.txt
          git commit -m "ops: record exact SKU size catalog queue" || exit 0
          git push origin HEAD:codex/vps-release-space
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_taha_vps
