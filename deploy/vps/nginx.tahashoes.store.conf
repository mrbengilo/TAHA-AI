map $http_upgrade $taha_connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 80;
  listen [::]:80;
  server_name tahashoes.store www.tahashoes.store;
  return 301 https://tahashoes.store$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name tahashoes.store;

  ssl_certificate /etc/letsencrypt/live/tahashoes.store/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tahashoes.store/privkey.pem;

  client_max_body_size 60m;
  auth_basic "TAHA AI";
  auth_basic_user_file /etc/nginx/.htpasswd-taha-ai;

  location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $taha_connection_upgrade;

    # Never trust identity headers supplied by a browser. Nginx replaces them
    # after HTTP Basic authentication and adds a root-only shared proof.
    proxy_set_header oai-authenticated-user-id $remote_user;
    proxy_set_header oai-authenticated-user-email "";
    proxy_set_header oai-authenticated-user-full-name "";
    include /etc/nginx/snippets/taha-ai-identity.conf;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.tahashoes.store;
  ssl_certificate /etc/letsencrypt/live/tahashoes.store/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tahashoes.store/privkey.pem;
  return 301 https://tahashoes.store$request_uri;
}
