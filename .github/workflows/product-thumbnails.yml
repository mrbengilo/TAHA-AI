name: Validate TAHA product thumbnails

on:
  push:
    branches: [fix/taha-product-thumbnails]
    paths:
      - scripts/add_product_thumbnails.py
      - .github/workflows/product-thumbnails.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message || '', '[thumbnail-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/taha-product-thumbnails
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Apply patch
        run: python3 scripts/add_product_thumbnails.py
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build and tests
        run: pnpm test
      - name: Commit validated fix
        run: |
          rm -f scripts/add_product_thumbnails.py .github/workflows/product-thumbnails.yml
          git config user.name "TAHA AI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: render product image thumbnails [thumbnail-fixed]"
          git push origin HEAD:fix/taha-product-thumbnails
