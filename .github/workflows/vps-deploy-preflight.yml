name: TAHA VPS deploy preflight

on:
  push:
    branches: [main]
    paths: [.github/workflows/vps-deploy-preflight.yml]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.TAHA_VPS_HOST }}
      VPS_USER: ${{ secrets.TAHA_VPS_USER }}
      VPS_PORT: ${{ secrets.TAHA_VPS_PORT }}
      VPS_KEY: ${{ secrets.TAHA_VPS_SSH_PRIVATE_KEY }}
    steps:
      - name: Verify deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'TAHA_VPS_HOST_MISSING'; exit 78; }
          test -n "$VPS_USER" || { echo 'TAHA_VPS_USER_MISSING'; exit 78; }
          test -n "$VPS_PORT" || { echo 'TAHA_VPS_PORT_MISSING'; exit 78; }
          test -n "$VPS_KEY" || { echo 'TAHA_VPS_SSH_PRIVATE_KEY_MISSING'; exit 78; }
          echo 'VPS_SECRETS_READY'

      - name: Configure ephemeral SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/id_taha_vps
          chmod 600 ~/.ssh/id_taha_vps

      - name: Inspect current VPS deployment read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -i ~/.ssh/id_taha_vps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'sh -s' <<'REMOTE'
          set -eu
          echo 'VPS_CONNECTED=yes'
          echo "user=$(id -un)"
          echo "host=$(hostname)"
          echo "kernel=$(uname -sr)"
          if [ -r /etc/os-release ]; then . /etc/os-release; echo "os=${PRETTY_NAME:-unknown}"; fi
          echo '-- tools --'
          for cmd in docker git curl nginx tar systemctl; do
            if command -v "$cmd" >/dev/null 2>&1; then echo "$cmd=present"; else echo "$cmd=missing"; fi
          done
          echo '-- disk --'
          df -h / /data 2>/dev/null || df -h /
          echo '-- docker containers --'
          if command -v docker >/dev/null 2>&1; then
            docker ps -a --format 'name={{.Names}}|image={{.Image}}|status={{.Status}}|ports={{.Ports}}'
            echo '-- docker mounts --'
            for cid in $(docker ps -aq); do
              docker inspect -f 'name={{.Name}}|image={{.Config.Image}}|mounts={{range .Mounts}}{{.Source}}=>{{.Destination}}:{{.Mode}};{{end}}' "$cid" 2>/dev/null || true
            done
          fi
          echo '-- TAHA repositories --'
          found_repo=0
          for rootdir in /root /opt /srv /var/www /home; do
            [ -d "$rootdir" ] || continue
            find "$rootdir" -maxdepth 5 -type d -name .git -print 2>/dev/null | while read -r gitdir; do
              repo=${gitdir%/.git}
              remote=$(git -C "$repo" remote get-url origin 2>/dev/null || true)
              case "$remote" in
                *mrbengilo/TAHA-AI*|*TAHA-AI.git*)
                  branch=$(git -C "$repo" branch --show-current 2>/dev/null || true)
                  head=$(git -C "$repo" rev-parse HEAD 2>/dev/null || true)
                  dirty=$(git -C "$repo" status --porcelain 2>/dev/null | wc -l | tr -d ' ')
                  echo "repo=$repo|branch=$branch|head=$head|dirty=$dirty"
                  ;;
              esac
            done
          done
          echo '-- persistent paths --'
          for path in /data /root/taha-ai /opt/taha-ai /srv/taha-ai /var/lib/taha-ai; do
            if [ -e "$path" ]; then
              stat -c 'path=%n|type=%F|owner=%U:%G|mode=%a' "$path" 2>/dev/null || true
              du -sh "$path" 2>/dev/null || true
            fi
          done
          echo '-- environment metadata --'
          for path in /root/taha-ai/.dev.vars /opt/taha-ai/.dev.vars /srv/taha-ai/.dev.vars; do
            if [ -f "$path" ]; then
              stat -c 'env=%n|owner=%U:%G|mode=%a|size=%s' "$path"
              echo 'env_keys_begin'
              sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' "$path" | sort -u
              echo 'env_keys_end'
            fi
          done
          echo '-- nginx --'
          if command -v nginx >/dev/null 2>&1; then
            nginx -t 2>&1 | tail -5 || true
            for path in /etc/nginx/sites-enabled/tahashoes.store /etc/nginx/sites-enabled/tahashoes.store.conf /etc/nginx/conf.d/tahashoes.store.conf; do
              [ -e "$path" ] && echo "nginx_config=$path"
            done
          fi
          echo '-- timers and cron --'
          if command -v systemctl >/dev/null 2>&1; then
            systemctl list-timers --all --no-pager 2>/dev/null | grep -Ei 'taha|cron' || true
          fi
          crontab -l 2>/dev/null | sed -E 's/(Bearer|Authorization:)[^ ]+/***REDACTED***/g' | grep -Ei 'taha|cron|tick|curl' || true
          echo '-- local health --'
          curl -sS -o /dev/null -w 'local_8787_http=%{http_code}\n' --max-time 5 http://127.0.0.1:8787/ 2>/dev/null || echo 'local_8787_http=unreachable'
          REMOTE
