name: Resolve exact TAHA catalog conflicts

on:
  push:
    branches: [codex/vps-release-space]
    paths:
      - deploy/vps/resolve-catalog-conflicts.py
      - tests/vps_catalog_conflict_resolution_test.py
      - .github/workflows/vps-resolve-catalog-conflicts.yml

permissions:
  contents: read

concurrency:
  group: taha-vps-production
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_HOST: ${{ secrets.TAHA_VPS_HOST }}
      VPS_USER: ${{ secrets.TAHA_VPS_USER }}
      VPS_PORT: ${{ secrets.TAHA_VPS_PORT }}
      VPS_KEY: ${{ secrets.TAHA_VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact cancellation guards
        run: python3 -m unittest discover -s tests -p vps_catalog_conflict_resolution_test.py
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/id_taha_vps
          chmod 600 ~/.ssh/id_taha_vps
      - name: Cancel exact unscheduled conflicts and keep cron held
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -i ~/.ssh/id_taha_vps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            python3 -u - < deploy/vps/resolve-catalog-conflicts.py
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_taha_vps
