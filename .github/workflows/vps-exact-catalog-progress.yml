name: Read exact SKU size catalog progress

on:
  push:
    branches: [codex/vps-exact-catalog-monitor]
    paths: [deploy/vps/exact-catalog-progress.py, .github/workflows/vps-exact-catalog-progress.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ secrets.TAHA_VPS_HOST }}
      VPS_USER: ${{ secrets.TAHA_VPS_USER }}
      VPS_PORT: ${{ secrets.TAHA_VPS_PORT }}
      VPS_KEY: ${{ secrets.TAHA_VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/id_taha_vps
          chmod 600 ~/.ssh/id_taha_vps
      - name: Read exact catalog state
        run: |
          set -o pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -i ~/.ssh/id_taha_vps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            python3 -u - < deploy/vps/exact-catalog-progress.py 2>&1 | tee deploy/vps/exact-catalog-progress-output.txt
      - name: Save progress snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/vps/exact-catalog-progress-output.txt
          git commit -m "ops: record exact catalog progress" || exit 0
          git push origin HEAD:codex/vps-exact-catalog-monitor
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_taha_vps
