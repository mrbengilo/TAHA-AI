name: TAHA hold unstable cron 2026-09-17

on:
  push:
    branches: [ops/taha-runtime-recovery-20260917]
    paths: [.github/workflows/vps-cron-hold-20260917.yml]

permissions:
  contents: read

concurrency:
  group: taha-vps-production
  cancel-in-progress: false

jobs:
  hold:
    if: github.repository == 'mrbengilo/TAHA-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ secrets.TAHA_VPS_HOST }}
      VPS_USER: ${{ secrets.TAHA_VPS_USER }}
      VPS_PORT: ${{ secrets.TAHA_VPS_PORT }}
      VPS_KEY: ${{ secrets.TAHA_VPS_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/id_taha_vps
          chmod 600 ~/.ssh/id_taha_vps
      - name: Pause only the unstable scheduler and verify the application
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -i ~/.ssh/id_taha_vps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" python3 -B -u - <<'PY'
          import fcntl
          import json
          from pathlib import Path
          import subprocess
          import time

          EXPECTED_ID = '9eb00e54202e'
          EXPECTED_IMAGE = 'tahashoes-taha-ai:2a7f08279db22c5d2966d8ff39559815ce811819'
          EXPECTED_STARTED_AT = '2026-09-17T16:14:20.996824677Z'
          ENV = Path('/etc/taha-ai/.dev.vars')

          def run(args, timeout=15):
              try:
                  p = subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=timeout)
                  return p.returncode, p.stdout, p.stderr
              except (OSError, subprocess.TimeoutExpired):
                  return 124, '', ''

          def inspect():
              rc, out, _ = run(['docker', 'inspect', 'taha-ai'])
              if rc:
                  raise SystemExit('TARGET_CONTAINER_MISSING')
              item = json.loads(out)[0]
              if (not item['Id'].startswith(EXPECTED_ID) or item['Config']['Image'] != EXPECTED_IMAGE
                      or item['State'].get('StartedAt') != EXPECTED_STARTED_AT or not item['State'].get('Running')):
                  raise SystemExit('TARGET_RUNTIME_CHANGED')
              return item

          def token():
              for line in ENV.read_text().splitlines():
                  key, sep, value = line.partition('=')
                  if sep and key.strip() == 'INTERNAL_API_SECRET':
                      value = value.strip().strip('\"\'')
                      if value:
                          return value
              raise SystemExit('INTERNAL_API_SECRET_MISSING')

          def http(value):
              rc, out, _ = run(['curl', '-sS', '--connect-timeout', '4', '--max-time', '10', '-o', '/dev/null', '-w', '%{http_code}', '-H', 'Authorization: Bearer ' + value, 'http://127.0.0.1:8787/api/integrations'])
              return out.strip() if rc == 0 else '000'

          with open('/var/lock/taha-ai-release.lock', 'a') as lock:
              try:
                  fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
              except BlockingIOError:
                  raise SystemExit('RELEASE_IN_PROGRESS')
              initial = inspect()
              value = token()
              if http(value) != '200':
                  raise SystemExit('RUNTIME_NOT_HEALTHY')
              if run(['systemctl', 'stop', 'taha-ai-cron.timer'])[0]:
                  raise SystemExit('CRON_TIMER_STOP_FAILED')
              for _ in range(20):
                  _, state, _ = run(['systemctl', 'show', 'taha-ai-cron.service', '-p', 'ActiveState', '--value'])
                  if state.strip() not in ('active', 'activating', 'deactivating'):
                      break
                  time.sleep(1)
              else:
                  raise SystemExit('CRON_SERVICE_STILL_BUSY')
              samples = []
              for _ in range(3):
                  time.sleep(10)
                  current = inspect()
                  status = http(value)
                  samples.append({'http': status, 'sameStartedAt': current['State']['StartedAt'] == initial['State']['StartedAt']})
                  if status != '200' or current['State']['StartedAt'] != initial['State']['StartedAt']:
                      raise SystemExit('POST_PAUSE_HEALTH_CHECK_FAILED')
              print('CRON_HELD=' + json.dumps({'timer': 'inactive', 'samples': samples, 'queueWrites': 0, 'scheduleWrites': 0}), flush=True)
          PY
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_taha_vps
