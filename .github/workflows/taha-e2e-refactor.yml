name: TAHA end-to-end refactor

on:
  push:
    branches:
      - fix/taha-ai-end-to-end-automation
    paths:
      - scripts/apply_taha_e2e_fixes.py
      - .github/workflows/taha-e2e-refactor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor-and-test:
    if: ${{ !contains(github.event.head_commit.message || '', '[e2e-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/taha-ai-end-to-end-automation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Apply fixes
        run: python3 scripts/apply_taha_e2e_fixes.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build and tests
        run: pnpm test

      - name: Commit validated source
        run: |
          rm -f scripts/apply_taha_e2e_fixes.py .github/workflows/taha-e2e-refactor.yml
          git config user.name "TAHA AI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: complete TAHA SKU media and daily automation [e2e-fixed]"
          git push origin HEAD:fix/taha-ai-end-to-end-automation
