name: Recover the unsent September 8 Facebook post

on:
  push:
    branches: [codex/recover-sep8-facebook]
    paths: [.github/workflows/vps-recover-sep8-facebook.yml, deploy/vps/recover-facebook-content.py, deploy/vps/verify-sep8-facebook.mjs]

permissions:
  contents: read

concurrency:
  group: taha-vps-production
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      VPS_HOST: ${{ secrets.TAHA_VPS_HOST }}
      VPS_USER: ${{ secrets.TAHA_VPS_USER }}
      VPS_PORT: ${{ secrets.TAHA_VPS_PORT }}
      VPS_KEY: ${{ secrets.TAHA_VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/id_taha_vps
          chmod 600 ~/.ssh/id_taha_vps
      - name: Refresh PH0027 from current sizes and retry the same unsent job
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -i ~/.ssh/id_taha_vps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            python3 -u - 6649b4217580c5bec8aeb961ba06358226f77fe7 < deploy/vps/recover-facebook-content.py
      - name: Verify the actual Facebook post and deployed UI
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -i ~/.ssh/id_taha_vps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            'docker exec -i taha-ai node --input-type=module' < deploy/vps/verify-sep8-facebook.mjs
      - name: Remove runner key
        if: always()
        run: rm -f ~/.ssh/id_taha_vps
