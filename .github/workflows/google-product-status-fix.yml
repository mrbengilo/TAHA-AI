name: Validate Google product status parser fix

on:
  push:
    branches: [fix/google-product-status]
    paths:
      - scripts/fix_google_product_status.py
      - .github/workflows/google-product-status-fix.yml

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message || '', '[status-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/google-product-status
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Apply patch
        run: python3 scripts/fix_google_product_status.py
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build and tests
        run: pnpm test
      - name: Commit validated source
        run: |
          rm -f scripts/fix_google_product_status.py .github/workflows/google-product-status-fix.yml
          git config user.name "TAHA AI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: normalize Google product selling status [status-fixed]"
          git push origin HEAD:fix/google-product-status
