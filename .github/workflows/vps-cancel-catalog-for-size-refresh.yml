name: Quarantine catalog for SKU size refresh

on:
  push:
    branches: [codex/vps-release-space]
    paths: [deploy/vps/cancel-catalog-for-size-refresh.py, .github/workflows/vps-cancel-catalog-for-size-refresh.yml]

permissions:
  contents: read

jobs:
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.TAHA_VPS_HOST }}
      VPS_USER: ${{ secrets.TAHA_VPS_USER }}
      VPS_PORT: ${{ secrets.TAHA_VPS_PORT }}
      VPS_KEY: ${{ secrets.TAHA_VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify quarantine safety contract
        run: python3 -m unittest tests.vps_catalog_size_refresh_test
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/id_taha_vps
          chmod 600 ~/.ssh/id_taha_vps
      - name: Quarantine old catalog batch
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -i ~/.ssh/id_taha_vps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            python3 -u - < deploy/vps/cancel-catalog-for-size-refresh.py
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_taha_vps
