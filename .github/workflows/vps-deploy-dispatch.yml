name: Dispatch TAHA VPS production deploy

on:
  push:
    branches: [main]
    paths: [.github/workflows/vps-deploy-dispatch.yml]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch production deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run vps-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
