name: TAHA VPS deploy preflight

on:
  push:
    branches: [main]
    paths: [.github/workflows/vps-deploy-preflight.yml]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.TAHA_VPS_HOST }}
      VPS_USER: ${{ secrets.TAHA_VPS_USER }}
      VPS_PORT: ${{ secrets.TAHA_VPS_PORT }}
      VPS_KEY: ${{ secrets.TAHA_VPS_SSH_PRIVATE_KEY }}
    steps:
      - name: Verify deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'TAHA_VPS_HOST_MISSING'; exit 78; }
          test -n "$VPS_USER" || { echo 'TAHA_VPS_USER_MISSING'; exit 78; }
          test -n "$VPS_PORT" || { echo 'TAHA_VPS_PORT_MISSING'; exit 78; }
          test -n "$VPS_KEY" || { echo 'TAHA_VPS_SSH_PRIVATE_KEY_MISSING'; exit 78; }
          echo 'VPS_SECRETS_READY'

      - name: Classify host reachability
        shell: bash
        run: |
          set -euo pipefail
          if getent ahosts "$VPS_HOST" >/dev/null 2>&1; then echo 'HOST_RESOLVES=yes'; else echo 'HOST_RESOLVES=no'; fi
          case "$VPS_HOST" in
            *[A-Za-z]*) echo 'HOST_KIND=hostname' ;;
            *:*) echo 'HOST_KIND=ipv6' ;;
            *) echo 'HOST_KIND=ipv4_or_numeric' ;;
          esac
          for p in 80 443; do
            if nc -z -w 4 "$VPS_HOST" "$p" >/dev/null 2>&1; then echo "WEB_TCP_OPEN_PORT=$p"; else echo "WEB_TCP_CLOSED_PORT=$p"; fi
          done
          http_code=$(curl -kLsS -o /dev/null -w '%{http_code}' --max-time 6 "https://$VPS_HOST/" 2>/dev/null || true)
          [ -n "$http_code" ] && echo "HTTPS_RESPONSE_CODE=$http_code" || echo 'HTTPS_RESPONSE_CODE=none'

      - name: Configure ephemeral SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/id_taha_vps
          chmod 600 ~/.ssh/id_taha_vps

      - name: Test configured SSH endpoint
        shell: bash
        run: |
          set -euo pipefail
          if ! nc -z -w 5 "$VPS_HOST" "$VPS_PORT" >/dev/null 2>&1; then
            echo 'CONFIGURED_SSH_TCP=closed'
            exit 79
          fi
          echo 'CONFIGURED_SSH_TCP=open'
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 \
            -i ~/.ssh/id_taha_vps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'echo VPS_CONNECTED && id -un && hostname'
