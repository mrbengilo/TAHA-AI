name: TAHA AI quality

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Miniflare metadata is fixture data; tests need no external cf.json request.
      CLOUDFLARE_CF_FETCH_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Build and test
        run: pnpm test
      - name: Verify bounded VPS recovery guards
        run: python3 -m unittest discover -s tests -p 'vps_*_test.py' -v
