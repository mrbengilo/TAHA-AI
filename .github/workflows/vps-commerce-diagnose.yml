name: Diagnose commerce connections
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vps-commerce-diagnose.yml
      - deploy/vps/commerce-connection-diagnose.mjs
permissions:
  contents: read
concurrency:
  group: taha-vps-production
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main' && github.repository == 'mrbengilo/TAHA-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_HOST: ${{ secrets.TAHA_VPS_HOST }}
      VPS_USER: ${{ secrets.TAHA_VPS_USER }}
      VPS_PORT: ${{ secrets.TAHA_VPS_PORT }}
      VPS_KEY: ${{ secrets.TAHA_VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/id_taha_vps
          chmod 600 ~/.ssh/id_taha_vps
      - name: Read commerce configuration and OAuth state safely
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -i ~/.ssh/id_taha_vps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            'docker exec -i taha-ai node --input-type=module -' < deploy/vps/commerce-connection-diagnose.mjs
      - name: Check callback routes without authorization data
        run: |
          set -euo pipefail
          for route in shopee tiktok-shop; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://tahashoes.store/api/integrations/$route/callback")
            test "$code" = 302 || test "$code" = 307
          done
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_taha_vps
