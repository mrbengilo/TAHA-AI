name: Sync and verify exact catalog SKU sizes

on:
  push:
    branches: [codex/vps-release-space]
    paths: [deploy/vps/sync-and-inspect-sku-sizes.py, .github/workflows/vps-sync-and-inspect-sku-sizes.yml]

permissions:
  contents: write

concurrency:
  group: taha-vps-catalog-size-sync
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_HOST: ${{ secrets.TAHA_VPS_HOST }}
      VPS_USER: ${{ secrets.TAHA_VPS_USER }}
      VPS_PORT: ${{ secrets.TAHA_VPS_PORT }}
      VPS_KEY: ${{ secrets.TAHA_VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/id_taha_vps
          chmod 600 ~/.ssh/id_taha_vps
      - name: Sync Google and verify every SKU size
        run: |
          set -o pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -i ~/.ssh/id_taha_vps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            python3 -u - < deploy/vps/sync-and-inspect-sku-sizes.py 2>&1 | tee deploy/vps/sku-size-sync-output.txt
      - name: Save SKU size result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/vps/sku-size-sync-output.txt
          git commit -m "ops: record exact SKU size sync" || exit 0
          git push origin HEAD:codex/vps-release-space
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_taha_vps
