name: TAHA AI quality

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - "codex/**"

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Miniflare metadata is fixture data; tests need no external cf.json request.
      CLOUDFLARE_CF_FETCH_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply merge-gate source fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/admin-post-template'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          editor = Path("app/settings/post-template/PostTemplateEditor.tsx")
          text = editor.read_text()
          old = '<div className="post-template-dialog-backdrop" role="presentation" onMouseDown={() => !saving && setConfirming(false)}>'
          new = '''<div
                  className="post-template-dialog-backdrop"
                  role="presentation"
                  onMouseDown={(event) => {
                    if (event.target === event.currentTarget && !saving) setConfirming(false);
                  }}
                >'''
          if old not in text:
              raise SystemExit("modal backdrop source no longer matches")
          text = text.replace(old, new, 1)
          old = '            onMouseDown={(event) => event.stopPropagation()}\n'
          if old not in text:
              raise SystemExit("dialog propagation source no longer matches")
          text = text.replace(old, "", 1)
          old = ' disabled={saving} autoFocus>'
          if old not in text:
              raise SystemExit("dialog autofocus source no longer matches")
          text = text.replace(old, ' disabled={saving}>', 1)
          editor.write_text(text)

          refresh = Path("lib/post-template-refresh.ts")
          text = refresh.read_text()
          old = '  type PostTemplateConfig,\n'
          if old not in text:
              raise SystemExit("unused PostTemplateConfig import no longer matches")
          refresh.write_text(text.replace(old, "", 1))
          PY

          git fetch origin main --depth=1
          git show origin/main:.github/workflows/quality.yml > .github/workflows/quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/settings/post-template/PostTemplateEditor.tsx lib/post-template-refresh.ts .github/workflows/quality.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix(content): satisfy merge quality gate"
            git push origin HEAD:codex/admin-post-template
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Build and test
        run: pnpm test
      - name: Verify bounded VPS recovery guards
        run: python3 -m unittest discover -s tests -p 'vps_*_test.py' -v
